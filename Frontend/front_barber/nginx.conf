server {
    listen 80;
    server_name barbershoparavan.ru www.barbershoparavan.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name barbershoparavan.ru www.barbershoparavan.ru;

    ssl_certificate /etc/letsencrypt/live/barbershoparavan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barbershoparavan.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
