services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://barber_user:barber_pass@postgres:5432/barber_db?schema=public
      - PORT=3000
    env_file:
      - .env
    networks:
      - app-network

  frontend:
    build:
      context: ../Frontend/front_barber
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge