services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - PORT=3001
    volumes:
      - ./prisma/dev.db:/app/dev.db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge