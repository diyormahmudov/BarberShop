services:
  postgres:
    image: postgres:16-alpine
    container_name: barber_db
    restart: always
    environment:
      POSTGRES_USER: barber_user
      POSTGRES_PASSWORD: barber_pass
      POSTGRES_DB: barber_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: barber_backend
    restart: always
    env_file:
      - ./Backend/.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./Frontend/front_barber
      dockerfile: Dockerfile
    container_name: barber_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  postgres_data:
